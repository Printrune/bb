services:
  - type: web
    name: battlebots-arena
    branch: codex/arena-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: MAX_ROOMS
        value: 1
      - key: ALLOWED_ORIGINS
        value: https://printrune.github.io
      - key: SESSION_SECRET
        generateValue: true
